<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
		<title>文件扫描工具</title>
		<link rel="stylesheet" href="/static/web/css/admin.css">
		<script src="/static/web/js/jquery.min.js"></script>
		<script src="/static/web/js/webajax.js"></script>
		<script src="/static/web/js/admin.main.js"></script>
	</head>
	<body>
		<div class="container-fluid">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="index_body.php">后台面板</a></li>
				<li class="breadcrumb-item active">文件扫描工具</li>
			</ol>
			<div class="card shadow-sm">
				<div class="card-header">文件扫描工具</div>
				<div class="card-body">
					<div class="alert alert-info">扫描会自动跳过模板缓存目录，建议扫完成后清空模板缓存。结果仅供参考，请确认源码后再删除文件</div>
					<div class="table-responsive">
						<table class="table table-borderless">
							<tbody>
								<tr>
									<td>
										<label>文件类型：<input type="text" name="filetype" id="filetype" value="php|inc" class="form-control admin-w-lg"></label>
										<label>代码特征：<input type="text" name="info" id="info" value="eval|cmd|system|exec|_GET|_POST|_REQUEST|base64_decode" class="form-control admin-w-lg"></label>
									</td>
								</tr>
								<tr>
									<td align="center">
										<a href="javascript:LoadCtTest();" class="btn btn-primary btn-sm">开始执行</a>
										<a href="javascript:LoadCtClear();" class="btn btn-primary btn-sm">清空模板缓存</a>
									</td>
								</tr>
								<tr>
									<td id="messagetd"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
		<script>
			function LoadCtTest() {
				var filetype = $Obj('filetype').value;
				var info = $Obj('info').value;
				fetch('sys_safetest.php?action=test&filetype=' + filetype + "&info=" + info).then(resp => {
					if (resp.ok) {
					   return resp.text()
					}
					throw new Error('系统错误，无法获取数据');
				}).then((d) => {
					$DE('messagetd').innerHTML = d;
				}).catch((error) => {
					console.log(error);
				});
			}
			function LoadCtClear() {
				fetch('sys_safetest.php?action=clear').then(resp => {
					if (resp.ok) {
						return resp.text()
					}
					throw new Error('系统错误，无法获取数据');
				}).then((d) => {
					$DE('messagetd').innerHTML = d;
				}).catch((error) => {
					$DE('messagetd').innerHTML = errMsg;
				});
			}
		</script>
	</body>
</html>
