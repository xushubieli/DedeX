		<script>
			function getCheckboxItem() {
				var allSel = '';
				if (document.form3.ids.value) return document.form3.ids.value;
				for (i = 0; i < document.form3.ids.length; i++) {
					if (document.form3.ids[i].checked) {
						if (allSel == "") {
							allSel = document.form3.ids[i].value;
						} else {
							allSel = allSel + "," + document.form3.ids[i].value;
						}
					}
				}
				return allSel;
			}
			function AllSel() {
				for (i = 0; i < document.form3.ids.length; i++) {
					document.form3.ids[i].checked = true;
				}
			}
			function NoneSel() {
				for (i = 0; i < document.form3.ids.length; i++) {
					document.form3.ids[i].checked = false;
				}
			}
			function DelSel() {
				var tid = getCheckboxItem();
				location = "tags_main.php?action=delete&ids=" + tid;
			}
			function DeleteOne(tid) {
				location = "tags_main.php?action=delete&ids=" + tid;
			}
			function UpdateOne(tid) {
				let count = document.getElementById('count' + tid).value;
				let litpic = document.getElementById('litpic' + tid).value;
				let title = document.getElementById('title' + tid).value;
				let keywords = document.getElementById('keywords' + tid).value;
				let description = document.getElementById('description' + tid).value;
				$.post("tags_main.php?action=update", {
					count: count,
					litpic: litpic,
					title: title,
					keywords: keywords,
					description: description,
					tid: tid,
				}, function(data) {
					if (data == "success") {
						location.reload();
					} else {
						ShowMsg(data);
					}
				});
			}
		</script>
