		<script>
			function ReadMsg(id) {
				$.get(`<?php echo $cfg_memberurl?>/pm.php?dopost=read&id=${id}`, function(data) {
					let result = JSON.parse(data);
					if (result.code === 200) {
						ShowMsg(`<p>标题：${result.data.subject}</p><p>内容：${result.data.message}</p><p>时间：${result.data.sendtime}</p>`, {title: "查看短消息",});
						$(`.pm-read-status[for='${id}']`).html("已阅读");
					} else {
						ShowAlert("#feedback-alert", `评论失败：${result.msg}`, "danger");
					}
				})
			}
		</script>
