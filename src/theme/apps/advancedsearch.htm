		<script>
		(function() {
			const kw = "{dede:global.q function='RemoveXSS(@me)'/}".trim();
			const content = document.getElementById('ai-content');
			const box = document.getElementById('ai-box');
			if (!kw || !content || !box) return;
			const cacheKey = `q_${kw}`;
			const PageNo = parseInt(new URLSearchParams(window.location.search).get('pageno')) || 1;
			const isPagination = PageNo > 1;
			if (isPagination) {
				const cached = localStorage.getItem(cacheKey);
				if (cached) {
					try {
						const { paragraphs } = JSON.parse(cached);
						box.style.display = 'block';
						content.innerHTML = '';
						paragraphs.forEach(text => {
							const p = document.createElement('p');
							p.textContent = text;
							content.appendChild(p);
						});
						return;
					} catch (e) {}
				}
			}
			fetch(`{dede:global.cfg_phpurl/}/search_ai.php?q=${encodeURIComponent(kw)}`).then(r => r.ok ? r.text() : Promise.reject()).then(html => {
				if (!html.trim()) return;
				const doc = new DOMParser().parseFromString(html, 'text/html');
				const paras = Array.from(doc.body.children).filter(el => el.tagName === 'P').map(p => p.textContent.trim()).filter(t => t);
				if (!paras.length) return;
				localStorage.setItem(cacheKey, JSON.stringify({
					keyword: kw,
					paragraphs: paras,
					timestamp: Date.now(),
					ttl: 3600000
				}));
				box.style.display = 'block';
				content.innerHTML = '';
				let i = 0;
				const next = () => {
					if (i >= paras.length) return;
					const p = content.appendChild(document.createElement('p'));
					let j = 0, txt = paras[i++];
					const timer = setInterval(() => {
						if (j < txt.length) p.textContent += txt[j++];
						else {
							clearInterval(timer);
							setTimeout(next, 500);
						}
						content.scrollTop = content.scrollHeight;
					}, 30);
				};
				next();
			})
			.catch(() => {
				const cached = localStorage.getItem(cacheKey);
				if (cached && isPagination) {
					try {
						const { paragraphs } = JSON.parse(cached);
						box.style.display = 'block';
						content.innerHTML = '';
						paragraphs.forEach(text => {
							const p = document.createElement('p');
							p.textContent = text;
							content.appendChild(p);
						});
					} catch (e) {}
				}
			});
		})();
		</script>
